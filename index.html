<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPIRIX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" type="image/png" href="icon-192.png">

<title>SPIRIX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#07060A;--card:#121014;--ink:#F4EDEE;--mute:#A8999C;--line:#2B1A1E;--acc:#E01B24;--acc-ink:#fff;--gold:#FF4D4D;--silver:#BDB4B6;--bronze:#D08A55;--t-name:#FF6B6B;--t-film:#FFA14A;--t-text:#E6D3A3;--t-other:#9B8E92;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.hero{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#17203A,#2A3F6E);margin-bottom:14px;box-shadow:0 8px 24px rgba(23,32,58,.25)}
.hero svg{width:54px;height:54px;flex:none}
.hero h1{margin:0;font-size:24px;font-weight:800;line-height:1.2}
.hero p{margin:2px 0 0;font-size:13px;opacity:.75}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.tab.add{color:var(--acc);border-style:dashed}
.head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.title{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:800;background:transparent;border:0;border-bottom:2px dashed var(--line);color:var(--ink);padding:4px 0}
.title:focus{outline:none;border-bottom-color:var(--acc)}
.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:10px;cursor:pointer}
.ghost.warn{color:#C0392B}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.views{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px}
.views button{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:10px;padding:7px;background:transparent;color:var(--mute);cursor:pointer}
.views button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 2px 10px}
.opt input{accent-color:var(--acc);width:18px;height:18px}
ol{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;position:relative}
.row.drag{box-shadow:0 10px 28px rgba(0,0,0,.3);z-index:5;border-color:var(--acc)}
.rk{flex:none;width:36px;text-align:center;font-size:26px;font-weight:800;line-height:1;color:var(--mute)}
.r1 .rk{color:var(--gold);font-size:32px}.r2 .rk{color:var(--silver);font-size:29px}.r3 .rk{color:var(--bronze);font-size:28px}
.r1{border-color:var(--gold)}
.body{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.nt{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:0 8px;border-radius:999px;border:1px solid currentColor;margin-inline-start:6px;vertical-align:middle}
.sc{flex:none;display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:12px;padding:2px}
.sc b{min-width:34px;text-align:center;font-size:16px;font-weight:800}
.ib{width:30px;height:30px;border:0;background:transparent;color:var(--mute);font-size:16px;cursor:pointer;border-radius:9px}
.ib:hover{background:var(--line)}
.ib:disabled{opacity:.3;cursor:default}
.ctl{display:flex;flex-direction:column;flex:none}
.grip{touch-action:none;cursor:grab;letter-spacing:-2px}
.empty{text-align:center;color:var(--mute);padding:26px 10px;border:1px dashed var(--line);border-radius:14px;margin-bottom:16px}
#pyr{display:none;margin-bottom:16px}
.tier{display:flex;gap:6px;margin:0 auto 6px;justify-content:center}
.cell{flex:1 1 0;min-width:0;text-align:center;border-radius:12px;padding:8px 4px;border:1px solid var(--line);background:var(--card);border-top-width:4px}
.cell .n{font-size:11px;color:var(--mute)}
.cell .t{font-weight:600;font-size:13px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.cell .s{font-weight:800;font-size:15px}
.k1{border-top-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card))}.k1 .s{color:var(--gold)}
.k2{border-top-color:var(--acc)}.k3{border-top-color:var(--t-film)}.k4{border-top-color:var(--t-text)}.k5{border-top-color:var(--mute)}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{font:inherit;font-size:13px;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.in{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea.in{resize:vertical;min-height:44px}
.two{display:grid;grid-template-columns:1fr 96px;gap:8px}
.go{font:inherit;font-weight:800;font-size:15px;padding:11px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
.bar{display:flex;gap:8px;margin-top:14px}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
#out{display:none;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{background:radial-gradient(120% 60% at 50% -8%,#3b0a10 0%,#12080b 45%,#07060A 75%) fixed}
.hero{border:1px solid #4a1418;background:linear-gradient(150deg,#1d0b0f,#0a090c);box-shadow:0 12px 40px rgba(224,27,36,.28)}
.hero img{width:64px;height:64px;border-radius:16px;flex:none;box-shadow:0 0 22px rgba(255,40,40,.55)}
.hero h1{font-size:26px;letter-spacing:.22em;text-shadow:0 0 18px rgba(255,60,60,.6)}
.hero p{color:#c9a9ac;opacity:1}
.row,.cell,.form,.views,.tab,.ghost{background:linear-gradient(180deg,#17131a,#0f0d12)}
.row{border-color:#2b1a1e}
.tab[aria-selected=true],.views button[aria-pressed=true]{background:linear-gradient(180deg,#f0262e,#a80f17);color:#fff;border-color:#ff5a60;box-shadow:0 0 14px rgba(224,27,36,.45)}
.r1{border-color:#ff4d4d;box-shadow:0 0 22px rgba(255,60,60,.25)}
.r1 .rk,.k1 .s{text-shadow:0 0 14px rgba(255,70,70,.8)}
.go{background:linear-gradient(180deg,#f0262e,#a80f17);box-shadow:0 6px 20px rgba(224,27,36,.4)}
.sc,.in{background:#0b0a0d}
.in{border-color:#2b1a1e}
.k1{background:linear-gradient(180deg,#3a0f14,#17131a)}
.ghost.warn{color:#ff8080}
.title{color:#fff}

.pyw{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 2px;filter:drop-shadow(0 0 18px rgba(224,27,36,.38))}
.slab{display:flex;max-width:100%;padding-block:8px;clip-path:polygon(var(--sl) 0,calc(100% - var(--sl)) 0,100% 100%,0 100%)}
.s1{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 50%),linear-gradient(180deg,#ff4b45,#c4151d)}
.s2{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 50%),linear-gradient(180deg,#a8121a,#730d14)}
.s3{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 50%),linear-gradient(180deg,#600b11,#3d080d)}
.s4{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 50%),linear-gradient(180deg,#34090d,#1f0a0e)}
.pc{flex:1 1 0;min-width:0;background:transparent;border:0;border-radius:0;border-inline-start:1px solid rgba(255,255,255,.16);color:#fff;font:inherit;padding:2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pc:first-child{border-inline-start:0}
.pc.on{background:rgba(255,255,255,.2)}
.pc:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.pc .pn{font-size:10px;opacity:.75}
.pc .pt{font-weight:600;font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.pc .ps{font-weight:800;font-size:14px}
.crown{color:#ffd36b;font-size:16px;line-height:1}
.det{margin-top:12px;background:linear-gradient(180deg,#17131a,#0f0d12);border:1px solid #3a1519;border-radius:18px;padding:12px 14px;display:grid;gap:10px}
.dtop{display:flex;align-items:center;gap:12px}
.drk{font-size:30px;font-weight:800;color:var(--gold);text-shadow:0 0 14px rgba(255,70,70,.7);min-width:48px;text-align:center}
.dnm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.dnm b{font-size:17px;overflow-wrap:anywhere}.dnm span{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.meter{height:8px;border-radius:99px;background:#26161a;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#a80f17,#ff4b45);border-radius:99px;transition:width .3s}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stats span{font-size:12px;color:var(--mute);border:1px solid #2b1a1e;border-radius:999px;padding:0 10px}
@keyframes rise{from{opacity:0;transform:translateY(-12px) scale(.94)}to{opacity:1;transform:none}}
.anim .slab{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*110ms)}
@media (prefers-reduced-motion:reduce){.anim .slab{animation:none}}

.nl{display:grid;gap:4px;margin-top:6px}
.nt2{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.6;color:var(--c);border-inline-start:3px solid var(--c);padding-inline-start:8px;overflow-wrap:anywhere}
.nt2 b{flex:none;font-size:13px;font-weight:800}
.nt2 span{flex:1;min-width:0;color:inherit;font-size:inherit}
.nt2 button{flex:none;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:12px;padding:0 4px;line-height:1.6}
.lnk{justify-self:start;font:inherit;font-size:12px;color:#ff8a8f;background:transparent;border:1px dashed #5a2a2f;border-radius:999px;padding:0 12px;cursor:pointer}
.addn{display:flex;gap:6px;align-items:center}
.addn .in{width:auto;flex:1;min-width:0;padding:6px 10px;font-size:14px}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0f0d12;border:1px solid #2b1a1e;border-radius:16px;padding:4px;margin-bottom:12px}
.nav button{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:12px;padding:8px;background:transparent;color:var(--mute);cursor:pointer}
.nav button[data-m=rank][aria-pressed=true]{background:linear-gradient(180deg,#f0262e,#a80f17);color:#fff;box-shadow:0 0 14px rgba(224,27,36,.45)}
.nav button[data-m=plan][aria-pressed=true]{background:linear-gradient(180deg,#3d8bff,#1747b8);color:#fff;box-shadow:0 0 14px rgba(61,139,255,.5)}
body.plan{background:radial-gradient(120% 60% at 50% -8%,#0b2455 0%,#0a1020 45%,#07060A 75%) fixed}
body.plan .hero{border-color:#1d3a78;box-shadow:0 12px 40px rgba(47,123,255,.3)}
body.plan .nav{border-color:#1e3566;background:#0a1020}
.pl{--pb:#3d8bff}
.pl button:focus-visible,.pl input:focus-visible,.pl textarea:focus-visible{outline-color:#5cc8ff}
.pdate{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(180deg,#101a30,#0b1223);border:1px solid #1e3566;border-radius:16px;padding:8px 10px;margin-bottom:10px}
.pdc{display:flex;flex-direction:column;align-items:center;line-height:1.4}
.pdc b{font-size:16px;color:#dbe9ff}
.pl .lnk{color:#7fb4ff;border-color:#27427d;margin-top:2px}
.pl .ib{color:#8fa6cf}.pl .ib:hover{background:#14213f}

.ptr{flex:1;height:8px;border-radius:99px;background:#14213f;overflow:hidden}
.ptr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f6bff,#5cc8ff);border-radius:99px;transition:width .3s}
#planBody{display:grid;gap:8px;margin-bottom:14px}
.pl .empty{border-color:#1e3566;margin:0}
.tk{background:linear-gradient(180deg,#101a30,#0b1223);border:1px solid #1e3566;border-radius:16px;padding:10px 12px}

.st .ck{width:20px;height:20px;font-size:11px;margin-top:0}

.st .ib{width:26px;height:26px;font-size:13px}

<body>

function startDrag(ev,li){

    for(var i=0;i<rows.length;i++){var r=rows[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=rows[i];break}}
    if(before!==li.nextSibling)ol.insertBefore(li,before)}
  function up(){g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up);g.removeEventListener("pointercancel",up);
    var ids=Array.prototype.map.call(ol.children,function(r){return r.dataset.id});
    cur().items.sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id)});save();renderAll()}

}

var pd=new Date(),pOpen=null,DG="۰۱۲۳۴۵۶۷۸۹";

    if(r)meta.appendChild(el("span","tm",r));

$("bkx").onclick=function(){var t=JSON.stringify(S);$("bk").value=t;try{navigator.clipboard.writeText(t).then(function(){toast("پشتیبان کپی شد")},function(){$("bk").select()})}catch(e){$("bk").select()}};
$("bki").onclick=function(){try{var d=JSON.parse($("bk").value);if(!d||!d.lists||!d.lists.length)throw 0;S=d;S.plan=S.plan||{};S.rec=S.rec||[];S.gen=S.gen||{};if(S.active>=S.lists.length)S.active=0;save();render();applyMode();show("sheet",0);toast("بازگردانی شد")}catch(e){toast("متن پشتیبان معتبر نیست")}};
$("pins").onclick=function(){var v=$("pin").value;if(!/^\d{4,6}$/.test(v)){toast("رمز باید ۴ تا ۶ رقم باشد");return}S.pin=v;save();$("pin").value="";toast("رمز ثبت شد")};
$("pinr").onclick=function(){delete S.pin;save();toast("رمز حذف شد")};
$("lock").onclick=function(){if(!S.pin){toast("اول رمز ثبت کنید");return}show("sheet",0);show("lockv",1)};
function unlock(){if($("lpin").value===S.pin){$("lpin").value="";show("lockv",0)}else toast("رمز اشتباه است")}
$("lgo").onclick=unlock;$("lpin").onkeydown=function(e){if(e.key==="Enter")unlock()};
function fit(x,t,w){if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+"…").width>w)t=t.slice(0,-1);return t+"…"}
function shareImg(){
  var L=cur().items.slice(0,15);if(!L.length)return;
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
    var W=1080,TW=960,TH=150,G=10,tiers=[],i=0,t=0;
    while(i<L.length){var n=Math.min(t+1,4);tiers.push(L.slice(i,i+n));i+=n;t++}
    var H=340+tiers.length*(TH+G)+60,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
    var bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#3b0a10");bg.addColorStop(.4,"#12080b");bg.addColorStop(1,"#07060A");x.fillStyle=bg;x.fillRect(0,0,W,H);
    try{x.drawImage($("logo"),W/2-60,50,120,120)}catch(e){}
    var F=" Vazirmatn,Tahoma,sans-serif";x.textAlign="center";x.direction="rtl";
    x.fillStyle="#fff";x.font="800 54px"+F;x.fillText("SPIRIX",W/2,240);
    x.fillStyle="#c9a9ac";x.font="600 34px"+F;x.fillText(fit(x,cur().title,TW),W/2,292);
    var cols=[["#ff4b45","#c4151d"],["#a8121a","#730d14"],["#600b11","#3d080d"],["#34090d","#1f0a0e"]];
    tiers.forEach(function(row,ti){
      var n=Math.min(ti+1,4),w=(28+24*(n-1))/100*TW,sl=ti<4?.12*TW:0,y=340+ti*(TH+G),cx=W/2,g=x.createLinearGradient(0,y,0,y+TH);
      g.addColorStop(0,cols[n-1][0]);g.addColorStop(1,cols[n-1][1]);x.fillStyle=g;
      x.beginPath();x.moveTo(cx-w/2+sl,y);x.lineTo(cx+w/2-sl,y);x.lineTo(cx+w/2,y+TH);x.lineTo(cx-w/2,y+TH);x.closePath();x.fill();
      row.forEach(function(it,k){
        var cw=w/n,mx=cx-w/2+cw*(k+.5),ix=L.indexOf(it);
        x.fillStyle="rgba(255,255,255,.75)";x.font="600 22px"+F;x.fillText("#"+fa(ix+1),mx,y+40);
        x.fillStyle="#fff";x.font="700 30px"+F;x.fillText(fit(x,it.title,cw-28),mx,y+82);
        x.fillStyle=ix===0?"#ffd36b":"#fff";x.font="800 32px"+F;x.fillText(fa(it.score),mx,y+124);
      });
    });
    $("pimg").src=c.toDataURL("image/png");show("imgv",1);
  });
}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
S=load();if(S.active>=S.lists.length)S.active=0;S.plan=S.plan||{};S.rec=S.rec||[];S.gen=S.gen||{};render();renderPri();applyMode();if(S.pin)show("lockv",1);
})();
</script>
